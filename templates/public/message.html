<!doctype html>
<html lang="{{ lang }}" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    {% load static %}
    {% include "includes/shellui_favicons.html" %}
    <link rel="stylesheet" href="{% static 'css/site.css' %}" />
    <title>{{ heading }}</title>
    <script>
      (function () {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="flex min-h-full flex-col items-center justify-center bg-background px-6 py-16 text-foreground antialiased">
    <main class="w-full max-w-md rounded-xl border border-border bg-card p-8 shadow-sm">
      {% if eyebrow %}
        <p class="text-sm font-medium text-muted-foreground">{{ eyebrow }}</p>
      {% endif %}
      <h1 class="mt-2 text-2xl font-semibold tracking-tight">{{ heading }}</h1>
      {% if body %}
        <p class="mt-3 text-sm text-muted-foreground">{{ body }}</p>
      {% endif %}
      {% if action %}
        <form method="post" class="mt-6">
          <button
            type="submit"
            class="inline-flex w-full items-center justify-center rounded-md bg-primary px-4 py-2.5 text-sm font-semibold text-primary-foreground transition-colors hover:bg-primary/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
          >
            {{ action }}
          </button>
        </form>
      {% endif %}
      {% if link_href %}
        <a
          href="{{ link_href }}"
          class="mt-6 inline-flex text-sm font-medium text-primary underline-offset-4 hover:underline"
          >{{ link_label }}</a
        >
      {% endif %}
    </main>
  </body>
</html>
