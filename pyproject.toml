[project]
name = "email-service"
version = "0.8.0"
description = "Email templates and delivery for Shellui services"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django==6.0.8",
    "djangorestframework==3.18.2",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.30.0",
    "drf-spectacular-sidecar==2026.10.1",
    "django-cors-headers==4.9.0",
    "python-dotenv==1.2.4",
    "dj-database-url==3.1.2",
    "psycopg[binary]==3.3.9",
    "gunicorn==26.0.0",
    "whitenoise==6.12.0",
    "sentry-sdk==2.75.0",
    "cryptography==50.0.2",
    "pyjwt==2.15.1",
    "requests==2.34.2",
    "prometheus-client==0.26.0",
    "redis==8.1.0",
    "celery==5.7.0",
    "shellui-django[mcp]==0.5.1",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
