[project]
name = "email-service"
version = "0.8.0"
description = "Email templates and delivery for Shellui services"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django==6.0.8",
    "djangorestframework==3.18.2",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.29.0",
    "drf-spectacular-sidecar==2026.10.1",
    "django-cors-headers==4.9.0",
    "python-dotenv==1.2.2",
    "dj-database-url==3.1.2",
    "psycopg[binary]==3.3.4",
    "gunicorn==26.0.0",
    "whitenoise==6.12.0",
    "sentry-sdk==2.63.0",
    "cryptography==50.0.0",
    "pyjwt==2.15.1",
    "requests==2.33.0",
    "prometheus-client==0.21.1",
    "redis==8.1.0",
    "celery==5.6.3",
    # Exact git pin: PyPI has no 0.4.1 yet; django-commons PR 14 is the canonical helper source.
    "shellui-django[mcp] @ git+https://github.com/shellui/django-commons.git@5f0fdf44bb140848fb1440cf04da6ada7996711d",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
