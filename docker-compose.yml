services:
  email-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: shellui/email-service:local
    container_name: email-service
    ports:
      - "${EMAIL_SERVICE_PORT:-8002}:8000"
    environment:
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required. Copy .env.example to .env and set SECRET_KEY}"
      DEBUG: "${DEBUG:-true}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      POSTGRES_DATABASE_URL: "${POSTGRES_DATABASE_URL:-}"
      REDIS_URL: "${REDIS_URL:-}"
      SQLITE_PATH: "/app/data/db.sqlite3"
      IDENTITY_SERVICE_URL: "${IDENTITY_SERVICE_URL:-http://host.docker.internal:8000}"
      IDENTITY_JWKS: "${IDENTITY_JWKS:-}"
      IDENTITY_JWKS_FILE: "${IDENTITY_JWKS_FILE:-}"
      IDENTITY_ISSUER: "${IDENTITY_ISSUER:-}"
      IDENTITY_AUDIENCE: "${IDENTITY_AUDIENCE:-}"
      CORS_ALLOW_ALL_ORIGINS: "${CORS_ALLOW_ALL_ORIGINS:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-2}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
      EMAIL_RENDERER: "${EMAIL_RENDERER:-node}"
      EMAIL_FALLBACK_PROVIDER: "${EMAIL_FALLBACK_PROVIDER:-resend}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-no-reply@shellui.com}"
      BULK_FROM_EMAIL: "${BULK_FROM_EMAIL:-news@news.shellui.com}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://email.shellui.com}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-}"
      SENTRY_RELEASE: "${SENTRY_RELEASE:-}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0}"
    volumes:
      - email-service-data:/app/data
    restart: unless-stopped

volumes:
  email-service-data:
