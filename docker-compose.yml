services:
  email-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: shellui/email-service:local
    container_name: email-service
    ports:
      - "${EMAIL_SERVICE_PORT:-8003}:8000"
    environment:
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required. Copy .env.example to .env and set SECRET_KEY}"
      DEBUG: "${DEBUG:-true}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      POSTGRES_DATABASE_URL: "${POSTGRES_DATABASE_URL:-}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      CELERY_BROKER_URL: "${CELERY_BROKER_URL:-}"
      # Lane workers and scheduled jobs run in this container. See docs/scheduled-jobs.md.
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-true}"
      EMAIL_WORKERS_ENABLED: "${EMAIL_WORKERS_ENABLED:-true}"
      CELERY_WORKER_CONCURRENCY: "${CELERY_WORKER_CONCURRENCY:-2}"
      SQLITE_PATH: "/app/data/db.sqlite3"
      IDENTITY_SERVICE_URL: "${IDENTITY_SERVICE_URL:-http://host.docker.internal:8000}"
      IDENTITY_JWKS: "${IDENTITY_JWKS:-}"
      IDENTITY_JWKS_FILE: "${IDENTITY_JWKS_FILE:-}"
      IDENTITY_ISSUER: "${IDENTITY_ISSUER:-}"
      IDENTITY_AUDIENCE: "${IDENTITY_AUDIENCE:-}"
      CORS_ALLOW_ALL_ORIGINS: "${CORS_ALLOW_ALL_ORIGINS:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-2}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
      EMAIL_FALLBACK_PROVIDER: "${EMAIL_FALLBACK_PROVIDER:-resend}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      RESEND_WEBHOOK_SECRET: "${RESEND_WEBHOOK_SECRET:-}"
      EMAIL_PLATFORM_COMPANY_IDS: "${EMAIL_PLATFORM_COMPANY_IDS:-}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-no-reply@shellui.com}"
      BULK_FROM_EMAIL: "${BULK_FROM_EMAIL:-news@news.shellui.com}"
      BULK_FROM_NAME: "${BULK_FROM_NAME:-Shellui}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://email.shellui.com}"
      EMAIL_PUBLIC_URL: "${EMAIL_PUBLIC_URL:-}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-}"
      SENTRY_RELEASE: "${SENTRY_RELEASE:-}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0}"
    volumes:
      - email-service-data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: email-service-redis
    restart: unless-stopped

  # Optional: run the lane workers and scheduled jobs in their own container. Set
  # SCHEDULER_ENABLED=false and EMAIL_WORKERS_ENABLED=false on email-service, then
  # uncomment. Same image and environment, command "worker".
  # email-worker:
  #   image: shellui/email-service:local
  #   command: worker
  #   environment:
  #     SECRET_KEY: "${SECRET_KEY}"
  #     DEBUG: "${DEBUG:-true}"
  #     REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
  #     SQLITE_PATH: "/app/data/db.sqlite3"
  #     RESEND_API_KEY: "${RESEND_API_KEY:-}"
  #   volumes:
  #     - email-service-data:/app/data
  #   depends_on:
  #     - redis
  #   restart: unless-stopped

volumes:
  email-service-data:
